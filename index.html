<!DOCTYPE html>
<html lang="en">
<head>


  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Focus Timer</title>
  <style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2563eb">


    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    #timer {
      font-size: 48px;
      margin: 20px 0;
    }
    .buttons button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    #session-count {
      margin: 10px 0;
      font-weight: bold;
    }
    #session-history {
      margin-top: 20px;
      text-align: left;
    }
    #session-history ul {
      padding-left: 20px;
      max-height: 150px;
      overflow-y: auto;
    }
    #session-history li {
      font-size: 14px;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Focus Timer</h1>
    <div id="timer">25:00</div>
    <p id="session-count">Completed Sessions: 0</p>
    <div class="buttons">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>

    <div id="session-history">
      <h3>Session History</h3>
      <label>
        <input type="checkbox" id="filter-today" />
        Show only today
      </label>
      <ul id="history-list"></ul>
      <button id="clear-history" style="background-color: #e11d48; color: white; border: none; padding: 8px 16px; border-radius: 6px; margin-top: 10px;">
        Clear Session History
      </button>
      <button id="download-history" style="background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; margin-top: 10px;">
        Download as CSV
      </button>
    </div>
  </div>

  <!-- Firebase & Timer Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDsPcSL7vNwQPVWP3Op_erpv9KOWlom3HE",
      authDomain: "focus-timer-app-4c12c.firebaseapp.com",
      projectId: "focus-timer-app-4c12c",
      storageBucket: "focus-timer-app-4c12c.firebasestorage.app",
      messagingSenderId: "382157499704",
      appId: "1:382157499704:web:e31a45b8125695648925cd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    signInAnonymously(auth).catch((error) => {
      console.error("Auth error:", error);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        updateSessionCount();
        updateSessionHistory();
      }
    });

    let time = 25 * 60;
    let timerInterval = null;
    let isRunning = false;

    const timerDisplay = document.getElementById("timer");
    const startBtn = document.getElementById("start");
    const pauseBtn = document.getElementById("pause");
    const resetBtn = document.getElementById("reset");

    function updateDisplay() {
      const minutes = Math.floor(time / 60);
      const seconds = time % 60;
      timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    async function recordSession() {
      if (!currentUser) return;

      try {
        await addDoc(collection(db, "sessions"), {
          userId: currentUser.uid,
          completedAt: new Date()
        });
        updateSessionCount();
        updateSessionHistory();
      } catch (error) {
        console.error("Error saving session:", error);
      }
    }

    async function updateSessionCount() {
      if (!currentUser) return;

      const q = query(collection(db, "sessions"), where("userId", "==", currentUser.uid));
      const querySnapshot = await getDocs(q);
      const count = querySnapshot.size;

      document.getElementById("session-count").textContent = `Completed Sessions: ${count}`;
    }

    async function updateSessionHistory() {
      if (!currentUser) return;

      const showTodayOnly = document.getElementById("filter-today").checked;
      const q = query(
        collection(db, "sessions"),
        where("userId", "==", currentUser.uid),
        orderBy("completedAt", "desc")
      );

      const querySnapshot = await getDocs(q);
      const historyList = document.getElementById("history-list");
      historyList.innerHTML = "";

      const today = new Date();
      const todayDate = today.toDateString();

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const date = new Date(data.completedAt.seconds * 1000);

        if (showTodayOnly && date.toDateString() !== todayDate) {
          return;
        }

        const formatted = date.toLocaleString(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        const li = document.createElement("li");
        li.textContent = `Completed at: ${formatted}`;
        historyList.appendChild(li);
      });
    }

    async function clearSessionHistory() {
      if (!currentUser) return;
      const confirmed = confirm("Are you sure you want to delete all session history?");
      if (!confirmed) return;

      const q = query(collection(db, "sessions"), where("userId", "==", currentUser.uid));
      const querySnapshot = await getDocs(q);

      const deletions = querySnapshot.docs.map(docSnap => deleteDoc(doc(db, "sessions", docSnap.id)));
      await Promise.all(deletions);

      updateSessionCount();
      updateSessionHistory();
      alert("Session history cleared.");
    }

    async function downloadSessionHistory() {
      if (!currentUser) return;

      const q = query(
        collection(db, "sessions"),
        where("userId", "==", currentUser.uid),
        orderBy("completedAt", "asc")
      );
      const querySnapshot = await getDocs(q);

      let csv = "Session Number,Completed At\n";
      querySnapshot.forEach((docSnap, index) => {
        const data = docSnap.data();
        const date = new Date(data.completedAt.seconds * 1000);
        const formatted = date.toLocaleString();
        csv += `${index + 1},"${formatted}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "session_history.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timerInterval = setInterval(() => {
        if (time > 0) {
          time--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          alert("Time's up!");
          recordSession();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
    }

    function resetTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      time = 25 * 60;
      updateDisplay();
    }

    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", pauseTimer);
    resetBtn.addEventListener("click", resetTimer);
    document.getElementById("filter-today").addEventListener("change", updateSessionHistory);
    document.getElementById("clear-history").addEventListener("click", clearSessionHistory);
    document.getElementById("download-history").addEventListener("click", downloadSessionHistory);

    updateDisplay();
    if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
    .then(() => console.log("Service Worker Registered"))
    .catch(console.error);
}

  </script>
</body>
</html>
